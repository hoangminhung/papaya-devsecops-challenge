# TARGET, not interim (OD24): kube-apiserver trusts GitHub's OIDC tokens directly, so no k0s
# credential is stored in GitHub at all. Structured authentication is stable from Kubernetes
# 1.34 (beta 1.30) and is not documented by k0s; it would be passed through spec.api.extraArgs
# (`authentication-config: <path>`), outside k0s support (R9.3.4, R9.3.5). It needs an API
# server the runner can reach (R9.3.8). The `sub` must use the repository's real format: new
# repositories use the immutable form with IDs (R9.3.9). Untested [design].
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
  - issuer:
      url: https://token.actions.githubusercontent.com
      audiences: ["k0s-prod"]
    claimValidationRules:
      - expression: 'claims.sub == "repo:example-org@<ORG_ID>/monorepo@<REPO_ID>:environment:production-k0s"'
        message: only the production-k0s environment of the monorepo may deploy
    claimMappings:
      username:
        expression: '"github-deploy:" + claims.sub'
