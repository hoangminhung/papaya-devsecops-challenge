# Reusable production deploy (framework layer 3 "Merge approval = deploy approval", layer 5).
# The ONLY workflow that references the `production` environment. Called by deploy-on-main.yml.
#
# Conditions this file must keep (checked by examples/tests/test_workflow_policy.py):
# - no ref/SHA input: it deploys the commit that was merged (github.sha of the push to main);
# - one concurrency group per stack without cancel-in-progress, so a running deploy is never
#   cancelled (Pulumi guide: that can leave infrastructure half-applied). GitHub still cancels
#   a run that is only *pending* when a newer one arrives, so not every merged commit gets its
#   own deploy run; the newer run deploys both commits;
# - OIDC only (id-token: write); no AWS keys; every action pinned to a full commit SHA;
# - it deploys only the current tip of main: re-running an old run (allowed for writers for 30
#   days, same GITHUB_SHA) would otherwise roll prod back without any approval;
# - prod preview -> risk stop -> apply; the risk stop step cannot be skipped or ignored.
#   No --skip-preview/-f, --target/-t, --exclude, --replace, state, import, destroy.
# - one GitHub environment per kind of stack (OD22): the IAM stack deploys from
#   `production-iam`, database changes from `production-db`, every other stack from
#   `production`. Each environment has its own OIDC subject, so its own deploy roles
#   (examples/aws/): code running in a domain stack's job cannot obtain the IAM stack's role
#   (the only role that may change SCP-exempt roles) or the database change role.
# - no install scripts run (npm_config_ignore_scripts), except for the packages on the reviewed
#   allowlist tools/ci/allowed-install-scripts.txt, an L3 path (OD22).
#
# Known limits (examples/README.md): the stack's own code (the Pulumi program, Serverless
# plugins) runs with that stack's deploy role during preview and apply, so the risk stop
# catches risky diffs nobody looked at, not malicious code that was approved; OD22 limits the
# damage to what that stack's role may do. `pulumi up` previews again; a change made outside
# the pipeline between the two previews is not re-checked.
#
# Variables of both environments (not secrets; same names, values per environment): AWS_REGION,
# PROD_PULUMI_DEPLOY_ROLE_ARN, PROD_SERVERLESS_DEPLOY_ROLE_ARN, PULUMI_BACKEND_URL,
# PULUMI_CLI_VERSION, NODE_VERSION. The Serverless License Key is read from
# SSM Parameter Store with the deploy role (sf >= 4.4.19, R4.4.8), so no CI secret holds it.
name: deploy-prod

on:
  workflow_call:
    inputs:
      stack:
        description: Stack name, e.g. claims-data. Also the deploy-approvals/<stack>/ directory.
        type: string
        required: true
      tool:
        description: "pulumi, serverless or sql (database changes, ADR-0011)"
        type: string
        required: true
      workdir:
        description: Directory of the stack in the monorepo
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    name: deploy ${{ inputs.stack }} to production
    runs-on: ubuntu-24.04
    # OD22: only the IAM stack gets `production-iam` (and so the IAM deploy role); only the `sql`
    # tool gets `production-db` (and so the database change role, ADR-0011), a job that installs
    # no npm package and runs no Pulumi program. The mapping lives here, in an L3 path, not in a
    # caller input. `inputs` is available in `environment` (✅ actionlint 1.7.12, which checks
    # context availability, accepts it).
    environment: >-
      ${{ inputs.stack == 'iam' && 'production-iam' || inputs.tool == 'sql' && 'production-db'
      || 'production' }}
    permissions:
      contents: read   # check out the merged commit
      id-token: write  # OIDC to the prod deploy role; no stored AWS keys
    concurrency:
      group: deploy-prod-${{ inputs.stack }}
      cancel-in-progress: false
    env:
      STACK: ${{ inputs.stack }}
      TOOL: ${{ inputs.tool }}
      WORKDIR: ${{ inputs.workdir }}
      # Every npm, npx and `pulumi install` in this job skips lifecycle scripts (R9.1.13: "npm
      # does not run scripts specified in package.json files"; ⚠️ whether this covers every
      # dependency's scripts is not stated, test on the runner).
      npm_config_ignore_scripts: "true"
    steps:
      - name: Check out the merged commit, with history for the risk-stop approval checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Refuse to deploy anything but the current tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # git/ref/heads/main names the branch explicitly; a tag called `main` cannot match.
          tip=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "This run is for $GITHUB_SHA but main is at $tip (re-run, or a newer merge)."
            echo "Nothing is deployed; the run for the newer commit deploys both."
            echo "If no newer run exists (e.g. its message had [skip ci]), merge an empty change."
            exit 1
          fi

      # Everything that downloads code is installed here, before the AWS credentials are in the
      # job's environment, and with install scripts off (job env above). A script that does run
      # (allowlist below) can still request the job's OIDC token, since id-token: write is
      # job-wide, or leave a process behind (examples/README.md, "Limits").
      - name: Install dependencies before any prod credential exists in the job
        if: inputs.tool != 'sql'
        working-directory: ${{ inputs.workdir }}
        run: npm ci

      # `npm rebuild <pkg>` runs the install scripts of the named packages only (R9.1.13).
      # The list is reviewed by the L3 owner team (CODEOWNERS: /tools/ci/).
      - name: Run install scripts of allowlisted packages only
        if: inputs.tool != 'sql'
        working-directory: ${{ inputs.workdir }}
        run: |
          mapfile -t allowed < <(grep -vE '^[[:space:]]*(#|$)' "$GITHUB_WORKSPACE/tools/ci/allowed-install-scripts.txt")
          if [ "${#allowed[@]}" -gt 0 ]; then
            npm rebuild --ignore-scripts=false "${allowed[@]}"
          fi

      - name: Install the Pulumi CLI only
        if: inputs.tool == 'pulumi'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ vars.PULUMI_CLI_VERSION }}

      - name: Install Pulumi plugins and the policy pack before credentials
        if: inputs.tool == 'pulumi'
        working-directory: ${{ inputs.workdir }}
        run: |
          pulumi install
          cd "$GITHUB_WORKSPACE/policy-packs/aws"
          npm ci
          pulumi install

      # ⚠️ From memory, not verified: Serverless v4's npm package downloads the framework on
      # first run. Running it once here keeps that download before the credentials. Whether
      # `--version` works before authentication (R4.4.8) is also unverified.
      - name: Install the Serverless Framework before credentials
        if: inputs.tool == 'serverless'
        working-directory: ${{ inputs.workdir }}
        run: npx serverless --version

      # Two roles per environment (framework layer 1; SCP in examples/aws/scp-prod-ou.json): only
      # the Pulumi role is exempt from the Lambda-update deny; the Serverless role only passes the
      # CloudFormation deploymentRole. This stops drift from `serverless deploy function`. Code in
      # this job can still request an OIDC token for either role of ITS environment, not for the
      # other environment's roles (OD22; examples/README.md, "Limits"). One step per tool, so an
      # unset variable fails the step instead of falling back to the other role.
      - name: AWS credentials through GitHub OIDC (Pulumi deploy role)
        if: inputs.tool == 'pulumi'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROD_PULUMI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # The run ID in the session name links CloudTrail events to this run (layer 7 change record).
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: AWS credentials through GitHub OIDC (Serverless deploy role)
        if: inputs.tool == 'serverless'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROD_SERVERLESS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}

      # Database changes (layer 3 "Database changes", ADR-0011, OD29). Aurora is reachable only
      # inside the prod VPC, so this runner never connects to it. The role may only start the
      # `db-change-claims` ECS task in that VPC and hand files to it through one S3 prefix
      # (examples/aws/db-change-ci-role-policy.json); the task's own role holds `rds-db:connect`
      # as the migration user (db-change-task-role-policy.json; R9.2.11).
      - name: AWS credentials through GitHub OIDC (database change role)
        if: inputs.tool == 'sql'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROD_DB_CHANGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preview prod (Pulumi)
        if: inputs.tool == 'pulumi'
        working-directory: ${{ inputs.workdir }}
        env:
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
        run: pulumi preview --stack "$STACK" --json > "$RUNNER_TEMP/preview.json"

      # Serverless Framework v4 (sf-core >= 4.37.0 for `diff`)
      - name: Package once and diff against prod (Serverless)
        if: inputs.tool == 'serverless'
        working-directory: ${{ inputs.workdir }}
        run: |
          npx serverless package --stage prod --package "$RUNNER_TEMP/sls-package"
          npx serverless diff --stage prod --package "$RUNNER_TEMP/sls-package" --json > "$RUNNER_TEMP/preview.json"

      # [design] The two tools/db scripts (an L3 path, like the risk stop) wrap Papaya's migration
      # tool, which is not known here. Both run their database part in a one-off Fargate task
      # (`aws ecs run-task`, then wait) in the prod VPC's private subnets, from an image pinned by
      # digest in the task definition. pending.sh asks the task which migrations and data fixes
      # are already applied (IDs only) and writes the rest as {"files": [{"path", "kind",
      # "sql"}]}. apply.sh uploads exactly that JSON and passes its SHA-256 in the command
      # override; the task refuses a bundle with another hash, applies the files in order, each
      # in its own transaction, rolls a data fix back when its row count differs from its
      # `-- expected_rows: N` header, and applies GraphQL-engine metadata with
      # `hasura metadata apply` and an admin secret the task definition injects from Secrets
      # Manager. The job shows statement kinds and row counts, never values.
      - name: List pending SQL files (database)
        if: inputs.tool == 'sql'
        working-directory: ${{ inputs.workdir }}
        run: '"$GITHUB_WORKSPACE/tools/db/pending.sh" > "$RUNNER_TEMP/preview.json"'

      # Risk stop (layer 3). Exit 0: no risky change, or a valid approval matches this preview.
      # Exit 3: risky change without a valid approval. Exit 2: unreadable preview. Any non-zero
      # exit fails the job here, before any Apply step. The summary goes to the job summary and
      # lists resource type, name, operation and changed property names, never values.
      - name: Risk stop
        run: >-
          python3 tools/risk-stop/classify.py
          --tool "$TOOL" --preview "$RUNNER_TEMP/preview.json"
          --approvals "deploy-approvals/$STACK" --repo "$GITHUB_WORKSPACE" --workdir "$WORKDIR"
          --summary "$RUNNER_TEMP/risk-summary.md"

      - name: Keep the filtered preview summary as evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: risk-summary-${{ inputs.stack }}
          path: ${{ runner.temp }}/risk-summary.md
          if-no-files-found: ignore

      # --yes is needed in CI (no terminal). Pulumi previews again before applying; a mandatory
      # policy violation stops the update (R4.2.2). This is the phase-2 shape: until the policy
      # pack exists (phase 2, layer 5), drop --policy-pack here and its install step above.
      - name: Apply (Pulumi)
        if: inputs.tool == 'pulumi'
        working-directory: ${{ inputs.workdir }}
        env:
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
        run: pulumi up --stack "$STACK" --yes --policy-pack "$GITHUB_WORKSPACE/policy-packs/aws"

      - name: Apply (database), the files that were classified
        if: inputs.tool == 'sql'
        working-directory: ${{ inputs.workdir }}
        run: '"$GITHUB_WORKSPACE/tools/db/apply.sh" "$RUNNER_TEMP/preview.json"'

      - name: Apply (Serverless), deploying the package that was diffed
        if: inputs.tool == 'serverless'
        working-directory: ${{ inputs.workdir }}
        run: npx serverless deploy --stage prod --package "$RUNNER_TEMP/sls-package"
